services:
  # ---------------------------------------------------------------------------
  # Valkey - Redis-compatible cache
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.1-alpine@sha256:a35428eba9043cc0b79dbe54100f0c92784f2de00ad09b01182bfb1c5c83d1bd
    container_name: hivebox-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      timeout: 5s
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: hivebox-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      timeout: 5s
      start_period: 10s

  # ---------------------------------------------------------------------------
  # HiveBox API
  # ---------------------------------------------------------------------------
  app:
    build: .
    container_name: hivebox-app
    ports:
      - "8000:8000"
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=hivebox
      - MINIO_SECURE=false
    depends_on:
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

volumes:
  minio-data:
